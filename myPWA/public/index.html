<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8"/>
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0"/>
    <meta http-equiv = "Content-Security-Policy" content = "script-src 'self';"/>

    <link rel = "manifest" href = "manifest.json" crossorigin = "use-credentials">

    <title>Tablegen</title>
  </head>

  <body>
    <h1>Welcome to Tablegen</h1>
    <div name = "register/login">
      <button type = "button" id = "registerBtn" class = "non-formBtns">Register</button>
      <button type = "button" id = "loginBtn" class = "non-formBtns">Login</button>
    </div>
    <div name = "staff/school" hidden>
      <button type = "button" id = "staffBtn" class = "non-formBtns">Staff</button>
      <button type = "button" id = "schoolBtn" class = "non-formBtns">School</button>
    </div>
    <div name = "formFields" hidden>
      <form id = "regsta">
        <h2>Register as staff</h2>
        <input type = "text" name = "username" placeholder = "Set Username" required/>
        <input type = "text" name = "password" placeholder = "Set Password" required/>
        <select name = "schoolName" class = "dropdown">
          <option value = "" disabled selected>Enter School Name</option>
        </select>
        <input type = "text" name = "schoolPassword" placeholder = "Enter School Password" required/>
        <button type = "submit">Submit</button>
      </form>
      <form id = "logsta">
        <h2>Log in as staff</h2>
        <input type = "text" name = "username" placeholder = "Enter Username" required/>
        <input type = "text" name = "password" placeholder = "Enter Password" required/>
        <button type = "submit">Submit</button>
      </form>
      <form id = "regsch" action = "/checkTimetable" method = "get">
        <h2>Register as a school</h2>
        <input type = "text" name = "schoolName" placeholder = "Set School Name" required/>
        <input type = "text" name = "schoolPassword" placeholder = "Set School Password" required/>
        <input type = "text" name = "adminPassword" placeholder = "Set Your Admin Password" required/>
        <button type = "submit">Submit</button>
      </form>
      <form id = "logsch">
        <h2>Log in as a school</h2>
        <select name = "schoolName" class = "dropdown">
          <option value = "" disabled selected>Enter School Name</option>
        </select>
        <input type = "text" name = "adminPassword" placeholder = "Enter Your Admin Password" required/>
        <button type = "submit">Submit</button>
      </form>
    </div>
    <button type = "button" id = "cancelBtn">Cancel</button>
  </body>

  <script src = "js/auth.js"></script>
  <script src = "js/initServiceWorker.js"></script>
</html>
