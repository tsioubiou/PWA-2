<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8"/>
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0"/>
        <meta http-equiv = "Content-Security-Policy" content = "script-src 'self';"/>

        <link rel = "manifest" href = "../manifest.json" crossorigin = "use-credentials">

        <title>Tablegen: Schools</title>
    </head>

    <body>
        <button id = "logoutBtn">Logout</button>
        <h1>Registered timetable:</h1>
        <div id = "timetableDiv">
            <table border = "1">
                <tr>
                    <th colspan = "5">Week 1</th>
                </tr>
                <tr>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
                <tbody id = "tableBodyWk1">
                    
                </tbody>
                <tr>
                    <th colspan = "5">Week 2</th>
                </tr>
                <tr>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
                <tbody id=  "tableBodyWk2">
                    
                </tbody>
            </table>
        </div>
        <h3>Faculty colours:</h3>
        <div id = "facultyColoursKey">
            
        </div>
        <button id = "createReplaceBtn">Create</button>
        <button id = "deleteBtn" hidden>Delete</button>
        <p id = "infoText"></p>
    </body>

    <script src = "../js/logout.js"></script>
    <script src = "../js/getTimetable.js"></script>
    <script src = "../js/manageTimetable.js"></script>
    <script src = "../js/initServiceWorker.js"></script>
</html>
